<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Juego educativo y portable para el entrenamiento en reconocimiento y manejo de la sepsis.">
  <title>Septris | Entrenamiento en sepsis</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/ajustes.css">
</head>
<body>
  <header class="encabezado">
    <div class="credito">Inspirado en: Stanford <span>|</span> Septris by Deving.edumed y Juan Bermúdez</div>
    <button id="boton-menu" class="boton-menu oculto" aria-label="Abrir menú">☰</button>
  </header>

  <main>
    <section id="pantalla-inicio" class="pantalla-inicio">
      <div class="escena-inicio">
        <div class="bata" role="img" aria-label="Bata médica"></div>
        <div class="puertas" role="img" aria-label="Puertas del hospital">
          <div class="puerta"><span></span></div>
          <div class="puerta"><span></span></div>
        </div>
        <div class="controles-inicio">
          <div class="notas">
            <button data-modal="acerca">Acerca de<br>Septris</button>
            <button data-modal="consejos">Consejos y<br>recomen&shy;daciones</button>
          </div>
          <button id="iniciar" class="boton-rojo">Iniciar nueva partida</button>
          <button id="tutorial" class="boton-rojo">Tutorial</button>
        </div>
      </div>
    </section>

    <section id="pantalla-juego" class="pantalla-juego oculto">
      <aside class="zona-pacientes">
        <div class="puntaje"><strong id="puntaje">0</strong><span>Puntaje</span></div>
        <span class="limite-alta">ALTA ↑</span>
        <div id="pacientes"></div>
        <span class="limite-muerte" title="Límite de fallecimiento"><span>QEPD</span><span class="lapida" aria-hidden="true">🪦</span></span>
        <span id="progreso"></span>
      </aside>

      <section class="panel-clinico">
        <div class="cabecera-paciente">
          <h1 id="nombre-paciente">Seleccione un paciente</h1>
          <div class="ayudas">
            <button data-modal="sirs">SRIS + Sepsis <b>?</b></button>
            <button data-modal="choque">Sepsis grave + choque <b>?</b></button>
            <button data-modal="news">Puntuación NEWS <b>?</b></button>
            <button data-modal="sofa">Puntuación SOFA <b>?</b></button>
          </div>
        </div>

        <div id="signos-vitales" class="signos-vitales">
          <span>Temperatura: -°</span><span>PA: -/-</span><span>FC: -</span><span>FR: -</span>
          <span>SpO₂: -</span><span>DU: -</span><span>NEWS: -</span><span>SOFA: -</span>
        </div>

        <div class="pestanas">
          <button class="pestana activa" data-pestana="cuadro">Cuadro</button>
          <button class="pestana" data-pestana="historia">HC</button>
        </div>

        <div id="vista-cuadro" class="contenido-pestana">
          <h2>Examen físico</h2><div id="resultado-examen" class="caja-clinica"></div>
          <h2>Laboratorios/Diagnóstico</h2><div id="resultado-laboratorios" class="caja-clinica"></div>
          <h2>Tratamientos</h2><div id="resultado-tratamientos" class="caja-clinica"></div>
        </div>

        <div id="vista-historia" class="contenido-pestana oculto">
          <p id="sin-paciente">No se ha seleccionado ningún paciente.</p>
          <article id="historia-paciente" class="oculto"></article>
        </div>
      </section>

      <nav class="acciones-principales" aria-label="Acciones clínicas">
        <button data-menu="examen"><span>♧</span>Examen físico</button>
        <button data-menu="laboratorios"><span>⚗</span>Laboratorios</button>
        <button data-menu="imagenes"><span>▧</span>Imágenes</button>
        <button data-menu="tratar"><span>♙</span>Tratar</button>
        <button data-menu="consultar"><span>♟</span>Consultar</button>
        <button data-menu="cultivos"><span>♨</span>Cultivos</button>
      </nav>
      <div id="submenu" class="submenu oculto"></div>
    </section>
  </main>

  <dialog id="menu-pausa" class="capa-modal">
    <div class="menu-pausa">
      <button id="reanudar">Reanudar</button>
      <fieldset><legend>Velocidad del juego</legend>
        <label><input type="radio" name="velocidad" value="lenta"> Lenta</label>
        <label><input type="radio" name="velocidad" value="normal" checked> Normal</label>
        <label><input type="radio" name="velocidad" value="rapida"> Rápida</label>
      </fieldset>
      <button id="volver-inicio">Reiniciar el juego y volver al menú</button>
    </div>
  </dialog>

  <div id="aviso" role="status" aria-live="polite"></div>

  <dialog id="modal-informativo">
    <button id="cerrar-modal" class="cerrar-modal" aria-label="Cerrar">×</button>
    <div id="contenido-modal"></div>
  </dialog>

  <script src="js/casos.js"></script>
  <script src="js/casos-personalizados.js"></script>
  <script src="js/contenido.js"></script>
  <script src="js/escalas.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/interfaz.js"></script>
</body>
</html>
